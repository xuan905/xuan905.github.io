<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xuan905 · Projects</title>
<meta name="description" content="xuan905 的專案首頁 — Jesus AI Conversation 技能官方網站">
<style>
  :root {
    --bg: #f6f8fb;
    --card: #ffffff;
    --text: #1a2332;
    --muted: #64748b;
    --accent: #2f6fed;
    --border: #e2e8f0;
    --shadow: 0 4px 20px rgba(15, 23, 42, 0.08);
  }
  [data-theme="dark"] {
    --bg: #0a0a0a;
    --card: #161616;
    --text: #f5f5f5;
    --muted: #a0a0a0;
    --accent: #f5c542;
    --border: #262626;
    --shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: background 0.3s, color 0.3s;
  }
  .theme-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 20px;
    cursor: pointer;
    box-shadow: var(--shadow);
    z-index: 10;
    transition: background 0.3s, border-color 0.3s;
  }
  .theme-toggle:hover { border-color: var(--accent); }
  .container { max-width: 860px; margin: 0 auto; padding: 64px 24px 48px; }
  header { text-align: center; margin-bottom: 48px; }
  .avatar {
    width: 80px; height: 80px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #9b5cf6);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 36px; color: #fff; font-weight: 700; margin-bottom: 16px;
  }
  h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
  .subtitle { color: var(--muted); font-size: 16px; }
  .section-title {
    font-size: 14px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.08em; margin: 32px 0 16px;
  }
  .projects { display: grid; gap: 16px; }
  .card {
    display: flex; align-items: center; gap: 16px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 20px 22px;
    text-decoration: none; color: inherit;
    box-shadow: var(--shadow);
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .card-icon {
    width: 48px; height: 48px; border-radius: 12px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
  }
  .card-body { flex: 1; min-width: 0; }
  .card-name { font-size: 17px; font-weight: 600; margin-bottom: 4px; color: inherit; text-decoration: none; display: inline-block; }
  .card-name:hover { color: var(--accent); }
  .card-desc { font-size: 14px; color: var(--muted); line-height: 1.5; }
  .card-links { display: flex; gap: 12px; font-size: 13px; margin-top: 6px; }
  .card-links a { color: var(--accent); text-decoration: none; font-weight: 500; }
  .card-links a:hover { text-decoration: underline; }
  footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 48px; }
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" aria-label="切換主題">🌙</button>
<div class="container">
  <header>
    <div class="avatar">x</div>
    <h1>xuan905</h1>
    <p class="subtitle">Projects &amp; Skills</p>
  </header>

  <div class="section-title">專案 Projects</div>
  <div class="projects">
    <div class="card">
      <a class="card-icon" style="background:#eef4ff;color:#2f6fed" href="./jesus-ai-conversation/" aria-label="Jesus AI Conversation">✝️</a>
      <div class="card-body">
        <a class="card-name" href="./jesus-ai-conversation/">Jesus AI Conversation</a>
        <div class="card-desc">以耶穌的愛與教導為藍本的靈性陪伴對話技能 — 18 種語言、6 大情境、安全界線設計。官方網站含完整介紹與安裝說明。</div>
        <div class="card-links">
          <a href="./jesus-ai-conversation/">官方網站 ↗</a>
          <a href="https://github.com/xuan905/jesus-ai-conversation" target="_blank" rel="noopener">GitHub</a>
          <a href="https://clawhub.ai/xuan905/skills/jesus-ai-conversation" target="_blank" rel="noopener">ClawHub</a>
        </div>
      </div>
    </div>
  </div>

  <footer>© 2026 xuan905 · Hosted on GitHub Pages</footer>
</div>

<script>
  (function () {
    var themeKey = "x905-theme";
    var btn = document.getElementById("themeToggle");
    function applyTheme(t) {
      document.documentElement.setAttribute("data-theme", t);
      btn.textContent = t === "dark" ? "☀️" : "🌙";
      try { localStorage.setItem(themeKey, t); } catch (e) {}
    }
    var stored = null;
    try { stored = localStorage.getItem(themeKey); } catch (e) {}
    if (!stored) {
      stored = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    applyTheme(stored);
    btn.addEventListener("click", function () {
      var cur = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      applyTheme(cur);
    });
  })();
</script>
</body>
</html>
